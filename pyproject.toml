[project]
name = "churn-model"
version = "0.1.0"
description = ""
authors = [
    {name = "Sv-ISh",email = "S-Ishbulatova@gmail.ru"}
]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "numpy (<2.0)",
    "scikit-learn (<1.8)",
    "pandas (<3.0)",
    "joblib (>=1.6.0,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "ruff (>=0.17.3,<0.18.0)",
    "mypy (>=2.4.1,<3.0.0)",
    "pre-commit (<4.5)"
]

[tool.mypy]
ignore_missing_imports = true
